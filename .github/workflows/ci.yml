name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev,genai]"
      - name: Train model and create local artifacts
        run: python -m churn_project.train
      - name: Test
        run: pytest
      - name: Run drift smoke test
        run: python -m churn_project.monitor --simulate-shift
